version: '3.8'

services:
  # --- INFRASTRUCTURE ---
  postgres:
    image: postgres:16-alpine
    container_name: tavilga_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-cronos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tavilga_net

  redis:
    image: redis:alpine
    container_name: tavilga_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - tavilga_net

  # --- APPLICATIONS ---
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: tavilga_backend
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASS:-postgres}@postgres:5432/${DB_NAME:-cronos}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tavilga_net
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: tavilga_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: https://api.tavilga.es # Adjust for actual domain
    ports:
      - "3000:3000"
    networks:
      - tavilga_net
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  tavilga_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
